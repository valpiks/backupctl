database:
  type: postgres
  postgres:
    host: localhost
    port: 5432
    user: postgres
    password: your_password_here
    name: your_db_name
    sslmode: disable

backup:
  type: full
  compression: gzip

storage:
  type: local
  local:
    path: ./backups

logging:
  level: info
  format: text
