runtime:
  env_file: /etc/backupctl/backupctl.env

database:
  type: postgres
  postgres:
    host: localhost
    port: 5432
    user: postgres
    password_env: BACKUPCTL_POSTGRES_PASSWORD
    name: app
    sslmode: disable
  mongo:
    uri_env: BACKUPCTL_MONGO_URI
    database: app

backup:
  type: full
  compression: gzip
  scheduler:
    enabled: true
    interval: 24h
    log_file: /var/log/backupctl/scheduler.log

storage:
  type: local
  local:
    path: /var/lib/backupctl/backups

logging:
  level: info
  format: text
