database:
  type: postgres
  postgres:
    host: localhost
    port: 5432
    user: postgres
    password_env: BACKUPCTL_POSTGRES_PASSWORD
    name: your_db_name
    sslmode: disable

backup:
  type: full
  compression: gzip
  scheduler:
    enabled: true
    interval: 24h
    log_file: ./logs/backupctl-scheduler.log

storage:
  type: local
  local:
    path: ./backups

logging:
  level: info
