database:
  type: postgres
  postgres:
    host: localhost
    port: 5432
    user: postgres
    password: postgres
    name: testdb
    sslmode: disable

backup:
  type: full
  compression: gzip

storage:
  type: s3
  s3:
    bucket: backupctl-test
    region: us-east-1
    prefix: backups/
    endpoint: http://localhost:9000
    force_path_style: true

logging:
  level: info
